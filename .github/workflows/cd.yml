name: Continuous Deployment

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable Docker image tag to deploy or roll back to
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  prepare:
    name: Prepare release
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, x64, aws]
    outputs:
      image_tag: ${{ steps.release.outputs.image_tag }}
    steps:
      - name: Resolve image tag
        id: release
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.image_tag }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            image_tag="${MANUAL_TAG}"
          else
            image_tag="${RUN_NUMBER}-${HEAD_SHA:0:7}"
          fi

          [[ "${image_tag}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "Deploying release ${image_tag}"

      - name: Validate deployment configuration
        env:
          BACKEND_INSTANCE_ID: ${{ vars.BACKEND_INSTANCE_ID }}
          BACKEND_PRIVATE_DNS: ${{ vars.BACKEND_PRIVATE_DNS }}
          FRONTEND_INSTANCE_IDS: ${{ vars.FRONTEND_INSTANCE_IDS }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          test -n "$AWS_REGION"
          test -n "$REGISTRY"
          test -n "$BACKEND_INSTANCE_ID"
          test -n "$BACKEND_PRIVATE_DNS"
          test -n "$FRONTEND_INSTANCE_IDS"
          test -n "$APP_URL"
          [[ "$AWS_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ]]
          [[ "$REGISTRY" =~ ^[a-z0-9][a-z0-9_-]{1,254}$ ]]
          [[ "$BACKEND_INSTANCE_ID" =~ ^i-[a-f0-9]+$ ]]
          [[ "$BACKEND_PRIVATE_DNS" =~ ^[A-Za-z0-9.-]+$ ]]
          for instance_id in $FRONTEND_INSTANCE_IDS; do
            [[ "$instance_id" =~ ^i-[a-f0-9]+$ ]]
          done
          aws sts get-caller-identity

  deploy-backend:
    name: Deploy backend
    needs: prepare
    runs-on: [self-hosted, linux, x64, aws]
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      - name: Deploy immutable backend image through SSM
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          INSTANCE_ID: ${{ vars.BACKEND_INSTANCE_ID }}
        run: |
          script_b64="$(base64 -w 0 github/deploy/deploy-backend.sh)"
          command="echo '${script_b64}' | base64 -d | sudo tee /tmp/deploy-backend.sh >/dev/null && sudo chmod 700 /tmp/deploy-backend.sh && sudo /tmp/deploy-backend.sh '${REGISTRY}' '${IMAGE_TAG}' '${AWS_REGION}'"
          parameters="$(jq -nc --arg command "$command" '{commands:[$command]}')"

          command_id=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy saludos backend ${IMAGE_TAG}" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID"

  deploy-frontend:
    name: Deploy frontend
    needs: [prepare, deploy-backend]
    runs-on: [self-hosted, linux, x64, aws]
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      - name: Deploy immutable frontend image through SSM
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          INSTANCE_IDS: ${{ vars.FRONTEND_INSTANCE_IDS }}
          BACKEND_PRIVATE_DNS: ${{ vars.BACKEND_PRIVATE_DNS }}
        run: |
          script_b64="$(base64 -w 0 github/deploy/deploy-frontend.sh)"
          for instance_id in $INSTANCE_IDS; do
            command="echo '${script_b64}' | base64 -d | sudo tee /tmp/deploy-frontend.sh >/dev/null && sudo chmod 700 /tmp/deploy-frontend.sh && sudo /tmp/deploy-frontend.sh '${REGISTRY}' '${IMAGE_TAG}' '${BACKEND_PRIVATE_DNS}'"
            parameters="$(jq -nc --arg command "$command" '{commands:[$command]}')"

            command_id=$(aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$instance_id" \
              --document-name AWS-RunShellScript \
              --comment "Deploy saludos frontend ${IMAGE_TAG}" \
              --parameters "$parameters" \
              --query 'Command.CommandId' \
              --output text)

            aws ssm wait command-executed \
              --region "$AWS_REGION" \
              --command-id "$command_id" \
              --instance-id "$instance_id"

            aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$command_id" \
              --instance-id "$instance_id"
          done

  verify:
    name: Verify deployment
    needs: [prepare, deploy-frontend]
    runs-on: [self-hosted, linux, x64, aws]
    steps:
      - name: Verify application endpoints
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          curl --fail --retry 12 --retry-delay 5 "${APP_URL}/health"
          curl --fail --retry 12 --retry-delay 5 "${APP_URL}/api/health"
          curl --fail --retry 12 --retry-delay 5 "${APP_URL}/api/saludo"

      - name: Deployment summary
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
        run: echo "Release ${IMAGE_TAG} deployed and verified at ${{ vars.APP_URL }}"
