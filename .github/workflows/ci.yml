name: Continuous Integration

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_DB: database
  IMAGE_BACKEND: backend
  IMAGE_FRONTEND: frontend

jobs:
  code:
    name: Code
    runs-on: [self-hosted, linux, x64, aws]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate immutable version
        id: version
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          version="${GITHUB_RUN_NUMBER}-${short_sha}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${version}"

  build:
    name: Build
    needs: code
    runs-on: [self-hosted, linux, x64, aws]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build database image
        run: docker build --pull -t "${IMAGE_DB}:ci-${GITHUB_SHA}" ./github/db

      - name: Build backend image
        run: docker build --pull -t "${IMAGE_BACKEND}:ci-${GITHUB_SHA}" ./github/backend

      - name: Build frontend image
        run: docker build --pull -t "${IMAGE_FRONTEND}:ci-${GITHUB_SHA}" ./github/frontend

  test:
    name: Test
    needs: build
    runs-on: [self-hosted, linux, x64, aws]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify built images
        run: |
          docker image inspect "${IMAGE_DB}:ci-${GITHUB_SHA}"
          docker image inspect "${IMAGE_BACKEND}:ci-${GITHUB_SHA}"
          docker image inspect "${IMAGE_FRONTEND}:ci-${GITHUB_SHA}"

      - name: Run backend unit tests
        run: |
          docker run --rm \
            --entrypoint pytest \
            -v "$PWD/github/backend/tests:/app/tests:ro" \
            "${IMAGE_BACKEND}:ci-${GITHUB_SHA}" \
            -p no:cacheprovider --cov=app --cov-report=term-missing

  release:
    name: Release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [code, test]
    runs-on: [self-hosted, linux, x64, aws]
    steps:
      - name: Tag release images
        env:
          VERSION: ${{ needs.code.outputs.version }}
          REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          test -n "$REGISTRY"
          for image in "$IMAGE_DB" "$IMAGE_BACKEND" "$IMAGE_FRONTEND"; do
            docker tag "${image}:ci-${GITHUB_SHA}" "${REGISTRY}/${image}:${VERSION}"
            docker tag "${image}:ci-${GITHUB_SHA}" "${REGISTRY}/${image}:latest"
          done

  push:
    name: Push
    needs: [code, release]
    runs-on: [self-hosted, linux, x64, aws]
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push release images
        env:
          VERSION: ${{ needs.code.outputs.version }}
          REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          for image in "$IMAGE_DB" "$IMAGE_BACKEND" "$IMAGE_FRONTEND"; do
            docker push "${REGISTRY}/${image}:${VERSION}"
            docker push "${REGISTRY}/${image}:latest"
          done

      - name: Logout from Docker Hub
        if: always()
        run: docker logout
